<template id="t-how">
<pre><span class="c">seeds    </span><span class="dim">a random 32-byte key from your crypto RNG feeds ChaCha12; seed i is its block i,
         so sharing one generated key reveals nothing about the others</span>
<span class="c">keys     </span><span class="dim">SHA-512 → clamp → fixed-base comb over a table of 14–16-bit signed windows,
         one field inversion per 64–128 keys (Montgomery's trick)</span>
<span class="c">matching </span><span class="dim">cheap filter on the key's low byte and top bits, then exact base58 on the GPU</span>
<span class="c">checking </span><span class="dim">every match is recomputed with a separate, plain ed25519 before it is shown</span>
<span class="c">odds     </span><span class="dim">each extra character is ~58× rarer; a prefix starting with J…z fits only
         43-character addresses (~17× rarer); -i (any case) helps a lot</span>
<span class="c">import   </span><span class="dim">Phantom / Solflare → Add wallet → Import private key; Solana CLI: use the .json</span>
<span class="c">safety   </span><span class="dim">for an address that will hold real money, use the native app on an offline machine</span>
<span class="c">license  </span><span class="dim">Apache 2.0 · © 2026 alhimikix</span></pre>
